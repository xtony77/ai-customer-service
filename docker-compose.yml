services:
  postgres:
    image: postgres:16-alpine
    container_name: designstudioops_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgresql:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ai-customer-service

  redis:
    image: redis:7-alpine
    container_name: designstudioops_redis
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    restart: unless-stopped
    networks:
      - ai-customer-service

networks:
  ai-customer-service:
    driver: bridge
